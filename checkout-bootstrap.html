
<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>AgroFeira — Fechar o pedido</title>

    <!-- Bootstrap 5.3.8 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <!-- Estilos do AgroFeira -->
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="agrofeira-bootstrap.css">

    <!-- JavaScript de validação -->
    <script defer src="validacao.js"></script>

</head>

<body data-bs-theme="light" class="tema-agrofeira">

    <main class="container py-4">

        <h1 class="h3 mb-4">
            Fechar o pedido
        </h1>

        <!-- Formulário de fechamento -->
        <form class="row g-3 needs-validation" novalidate>

            <!-- Nome completo -->
            <div class="col-12 col-md-6">

                <label for="nome" class="form-label">
                    Nome completo
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="nome"
                    name="nome"
                    autocomplete="name"
                    aria-describedby="nome-erro"
                    required>

                <div
                    class="invalid-feedback"
                    id="nome-erro">
                    Informe o seu nome.
                </div>

            </div>

            <!-- E-mail -->
            <div class="col-12 col-md-6">

                <label for="email" class="form-label">
                    E-mail
                </label>

                <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    autocomplete="email"
                    aria-describedby="email-erro"
                    required>

                <div
                    class="invalid-feedback"
                    id="email-erro">
                    Informe um e-mail, como maria@exemplo.com.br.
                </div>

            </div>

            <!-- Aceite das regras -->
            <div class="col-12">

                <div class="form-check">

                    <input
                        type="checkbox"
                        class="form-check-input"
                        id="termos"
                        name="termos"
                        aria-describedby="termos-erro"
                        required>

                    <label
                        for="termos"
                        class="form-check-label">
                        Li e aceito as regras da feira
                    </label>

                    <div
                        class="invalid-feedback"
                        id="termos-erro">
                        É preciso aceitar as regras para continuar.
                    </div>

                </div>

            </div>

            <!-- Botão de envio -->
            <div class="col-12">

                <button
                    type="submit"
                    class="btn btn-primary">
                    Fazer pedido
                </button>

            </div>

        </form>

    </main>

</body>
</html>
