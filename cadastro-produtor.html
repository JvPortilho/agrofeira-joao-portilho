<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Cadastro de produtor — AgroFeira</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Folhas de estilo -->
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <a class="pular" href="#conteudo">
        Pular para o conteúdo
    </a>

    <header class="cabecalho-site">

        <h1>Sobre a nossa Agrofeira</h1>

        <nav aria-label="Principal">

            <ul class="menu">

                <li>
                    <a href="index.html">
                        Início
                    </a>
                </li>

                <li>
                    <a href="safra.html">
                        Safra
                    </a>
                </li>

                <li>
                    <a href="cadastro-produtor.html" aria-current="page">
                        Cadastro
                    </a>
                </li>

                <li>
                    <a href="sobre.html">
                        Sobre
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <main id="conteudo">

        <h2>Cadastro de produtor</h2>

        <form class="formulario-cadastro" method="get">

            <!-- PRIMEIRO GRUPO -->
            <fieldset>

                <legend>Quem é você</legend>

                <p>
                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        autocomplete="name"
                        required>
                </p>


                <p>
                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required>
                </p>


                <p>
                    <label for="telefone">
                        Telefone
                    </label>

                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        autocomplete="tel">
                </p>


                <p>
                    <label for="caf">
                        Número do CAF
                    </label>

                    <input
                        type="text"
                        id="caf"
                        name="caf">
                </p>


                <p>
                    <label for="cep">
                        CEP da propriedade
                    </label>

                    <input
                        type="text"
                        id="cep"
                        name="cep"
                        aria-describedby="ajuda-cep">

                    <small id="ajuda-cep">
                        Informe o CEP da propriedade rural.
                    </small>
                </p>

            </fieldset>


            <!-- SEGUNDO GRUPO -->
            <fieldset>

                <legend>O que você vende</legend>


                <p>
                    <label for="produto">
                        Produto principal
                    </label>

                    <select
                        id="produto"
                        name="produto">

                        <option value="">
                            Selecione um produto
                        </option>

                        <option value="mandioca">
                            Mandioca
                        </option>

                        <option value="banana">
                            Banana-prata
                        </option>

                        <option value="acai">
                            Açaí
                        </option>

                        <option value="pimenta">
                            Pimenta-do-reino
                        </option>

                        <option value="cupuacu">
                            Cupuaçu
                        </option>

                        <option value="alface">
                            Alface
                        </option>

                    </select>
                </p>


                <p>
                    <label for="quantidade">
                        Quantidade por semana
                    </label>

                    <input
                        type="number"
                        id="quantidade"
                        name="quantidade"
                        min="0">
                </p>


                <p>
                    <label for="data">
                        Começa a entregar em
                    </label>

                    <input
                        type="date"
                        id="data"
                        name="data">
                </p>


                <!-- GRUPO INTERNO -->
                <fieldset>

                    <legend>Como entrega</legend>

                    <p>
                        <input
                            type="radio"
                            id="feira"
                            name="entrega"
                            value="feira">

                        <label for="feira">
                            Leva à feira
                        </label>
                    </p>


                    <p>
                        <input
                            type="radio"
                            id="retirada"
                            name="entrega"
                            value="retirada">

                        <label for="retirada">
                            A feira retira na propriedade
                        </label>
                    </p>

                </fieldset>


                <p>
                    <label for="observacao">
                        Observação
                    </label>

                    <textarea
                        id="observacao"
                        name="observacao"
                        rows="5"
                        cols="40"></textarea>
                </p>


                <p>
                    <input
                        type="checkbox"
                        id="regras"
                        name="regras">

                    <label for="regras">
                        Aceito as regras
                    </label>
                </p>

            </fieldset>


            <button type="submit">
                Enviar formulário
            </button>

        </form>

        <p role="status"></p>

    </main>


    <footer class="rodape-site">

        <p>
            Sobre a nossa Agrofeira
        </p>

    </footer>

</body>

</html>
